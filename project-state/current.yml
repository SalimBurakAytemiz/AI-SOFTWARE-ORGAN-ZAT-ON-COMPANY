summary: >
  Organization V1.0 remains the source of truth and its 85-test suite still passes.
  On top of it, the AI Software Company Agent Runtime V1.0 is now built: a
  TypeScript-first runtime (Node.js, no build step) that loads and re-validates the
  18 agents, 22 skills, 47 capabilities, 9 workflows and 14 policies, then
  coordinates them for a Human Founder task. It provides an agent/skill/tool/workflow
  registry loader, a default-deny capability gateway, a layered Human Approval Engine
  (only 'human-founder' decides; no self-approval), a gated workflow engine with
  durable checkpoint/resume on node:sqlite, an append-only schema-validated
  secret-redacted audit ledger, a provider-independent model abstraction with a
  deterministic MockModelProvider (no paid API key needed), a risk-based model
  router, honest cost accounting, an OpenTelemetry-shaped span buffer, a local
  sandbox, a global pause/kill switch, an ai-company CLI, and one safe end-to-end
  proof workflow that stops at HUMAN_APPROVAL_REQUIRED. 58 runtime tests plus the 85
  organization tests pass. No runtime was production-deployed; no real money, no real
  customer data, no production writes. Cleaning Commerce is still not implemented.
