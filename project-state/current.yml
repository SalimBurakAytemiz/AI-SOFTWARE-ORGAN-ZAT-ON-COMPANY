summary: >
  Organization V1.0 (85 tests) and Agent Runtime V1.0 (accepted into main via
  PR #1) remain the source of truth and are unchanged. On top of them, Runtime
  V1.1 - Real Agent Execution + Software Factory Proof - is built on branch
  feat/real-agent-execution-v1.1. It EXTENDS the existing runtime (AgentRunner,
  Orchestrator, WorkflowEngine, PolicyEngine, CapabilityGateway, ApprovalEngine,
  StateStore, AuditLog, ModelProvider abstraction) without introducing any new
  agent framework. New pieces: ONE generic OpenAI-compatible model provider
  (baseUrl + apiKeyEnv + model + timeout + retry + headers + usage), an
  environment-driven real-provider resolver with Groq Direct as the PREFERRED
  proof provider (default; GROQ_API_KEY, openai/gpt-oss-120b) and OpenRouter as
  the optional MANUAL fallback (never auto-added), and NVIDIA NIM
  (nvidia/nemotron-3.5-lightning-30b-a3b, NVIDIA_API_KEY) as the FREE-FIRST
  auto fallback engaged ONLY on a bounded Groq RATE_LIMIT_EXHAUSTED - the runner
  preserves the workflow checkpoint, records a provider_transition audit event
  (from_provider / to_provider / reason=RATE_LIMIT_EXHAUSTED / stage), switches
  provider and retries ONLY the blocked stage with no completed stage / tool
  write / artifact repeated; all PROOF_PROVIDER / NON_SENSITIVE_PROOF_ONLY, never
  an approved production provider, no paid provider; a reusable prompt/context assembler with
  acceptance-critical per-stage directives; a validated AgentExecutionResult
  contract (malformed / truncated -> one bounded classified retry -> BLOCK,
  never guessed) that is ALSO sent as a provider-native strict response_format
  JSON Schema where supported; a RealAgentRunner routing model tool-call
  requests through the Capability Gateway, with a bounded one-shot test-repair
  pass on the implementation stage; a provider-agnostic rate-limit scheduler
  (learns per-window request/token budget from Retry-After / x-ratelimit-*
  headers, paces real calls sequentially, waits out 429 reset windows over
  bounded cycles -> RATE_LIMIT_EXHAUSTED); a disposable proof workspace with
  default-deny workspace.read/list/write/patch/exec (path jail + command
  allow-list); a real-request budget (target <= 20, hard ceiling 30); a
  per-stage context and output-token budget; an attributable PROOF_ONLY artifact
  store under build/proof/<task>/; a proof-provider privacy guard that blocks
  PII/payment/production-secret tasks; a Software Factory proof driving
  feature-development with real agents for the 9 key roles, stopping at
  HUMAN_APPROVAL_REQUIRED; doctor rows + doctor --probe for every provider; and
  ai-company proof software-factory | real-agent | status plus audit --task.
  223 runtime tests + 85 organization tests pass; typecheck clean; gitleaks clean;
  offline. The full real-agent pipeline is proven end-to-end against local offline
  OpenAI-compatible fake servers + a mocked Codex CLI (strict JSON-Schema output + the
  json_schema -> json_object -> prompt-only self-heal cascade, bounded one-shot
  test-repair, rate-limit pacing / 429 waits / RATE_LIMIT_EXHAUSTED, truncation
