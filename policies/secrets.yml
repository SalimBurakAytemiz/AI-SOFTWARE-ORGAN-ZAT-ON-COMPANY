id: secrets
name: Secrets and Credentials Policy
purpose: >
  Keep secrets out of agents' hands. Written tool-agnostically so it can be satisfied
  by Infisical Agent Vault / Agent Proxy or any compliant credential proxy.
authority: human-founder
default: DENY
rules:
  - id: NEVER_COMMIT
    statement: No secret is ever committed. gitleaks blocks it at pre-commit and CI; a detected secret triggers rotation.
    effect: DENY
    applies_to: [all-agents]
    actions: [commit_secret]
    rationale: Constitution Article 8.
  - id: NO_PRODUCTION_SECRET_BY_DEFAULT
    statement: No agent has access to any production secret by default. Access is never a standing grant.
    effect: DENY
    applies_to: [all-agents]
    actions: [access_production_secret]
    rationale: Least privilege for the highest-value asset.
  - id: CREDENTIAL_PROXY_PATTERN
    statement: Where an agent's work needs a credential, the secret is injected at the network boundary by a credential proxy; the agent never receives the secret value.
    effect: REQUIRE_REVIEW
    applies_to: [all-agents, platform]
    actions: [use_credential]
    rationale: The agent can act without holding the secret (Agent Vault model).
  - id: SHORT_LIVED
    statement: Credentials are short-lived wherever the provider supports it; cloud access uses OIDC-issued short-lived tokens, never long-lived keys.
    effect: DENY
    applies_to: [all-agents, ci]
    actions: [issue_long_lived_credential, store_long_lived_cloud_key]
    rationale: Limit the window of a leak.
  - id: NON_PROD_ONLY_DIRECT
    statement: Only development/sandbox credentials may be used directly by agents (secrets.read_dev), and only via the proxy.
    effect: ALLOW
    applies_to: [integration-engineer, all-engineering-agents]
    actions: [secrets.read_dev]
    rationale: Dev credentials have minimal blast radius.
  - id: NO_SECRET_IN_PROMPT_LOG_MEMORY
    statement: No secret in a prompt, a log line, telemetry, or agent memory. Record references and fingerprints, never values.
    effect: DENY
    applies_to: [all-agents]
    actions: [put_secret_in_prompt, log_secret, store_secret_in_memory]
    rationale: Constitution Article 8; models and logs are not vaults.
  - id: ROTATION_IS_HUMAN_FOUNDER
    statement: Creating, rotating, or revoking a secret is a critical action performed only by the Human Founder.
    effect: REQUIRE_APPROVAL
    applies_to: [all-agents]
    actions: [secret_creation_rotation_revocation]
    approver: human-founder
    rationale: Constitution Article 3.
  - id: PROXY_LOGS_TO_AUDIT
    statement: The credential proxy's request log is an input to the audit trail (which destination, which session, when - never the secret).
    effect: REQUIRE_REVIEW
    applies_to: [platform]
    rationale: Traceability of credential use.
enforcement:
  - gitleaks pre-commit + CI; Trivy secrets; Repomix Secretlint pre-flight
  - tools/capabilities.yml marks secrets.production and secrets.rotate non-grantable
  - tests/test_permissions.py, tests/test_org_security.py
  - 'Runtime (future): credential proxy on HTTPS_PROXY; no secret env vars in agent containers'
related_policies: [human-approval, security, git, production]
review: On adoption of a credential proxy and on any secrets incident.
notes: >
  Tool status: credential-proxy is DEFERRED in tools/registry.yml (Agent Vault is a
  research preview). This policy is the contract the chosen proxy must meet.
