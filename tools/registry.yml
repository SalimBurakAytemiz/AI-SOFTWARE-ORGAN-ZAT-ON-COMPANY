# Tool Registry
#
# Every external tool the company uses, or has evaluated. Status is decided by
# research (see ../research/repositories/), NOT by appearing in the build prompt.
#
#   ADOPTED   - in use now for this organization repository or committed for the
#               next phase with no open questions
#   OPTIONAL  - approved for use where a team/agent chooses it; not mandatory
#   DEFERRED  - we will adopt it later; the design already accounts for it
#   REJECTED  - evaluated and not adopted, with a recorded reason
#   RESEARCH  - still under evaluation
#
# Per-tool narrative evaluations: ../research/repositories/<id>.md
# Capability decomposition: ./capabilities.yml

version: "1.0"

tools:
  - id: git
    name: Git
    category: vcs
    purpose: Distributed version control; the substrate for all change management.
    official_source: https://git-scm.com/
    license: GPL-2.0-only
    status: ADOPTED
    required: true
    optional: false
    used_by: [all-engineering-agents, platform, ci]
    installation_method: system package
    runtime_dependency: true
    trust_level: high
    security_risk: low
    permissions_required: [git.read, git.branch, git.commit, git.worktree]
    health_check: "git --version"
    update_policy: Track distro stable; no auto-update in CI images without review.
    adapter_required: false
    cost_model: free
    known_overlap: []
    knowledge_adoption: ADOPT
    runtime_decision: ADOPT
    notes: Baseline. Protected-branch rules enforced at the forge, not locally.

  - id: github
    name: GitHub
    category: forge
    purpose: Source hosting, pull requests, branch protection, code scanning, environments.
    official_source: https://github.com/
    license: proprietary-saas
    status: ADOPTED
    required: true
    optional: false
    used_by: [all-agents, ci, human-founder]
    installation_method: SaaS account + fine-grained tokens / GitHub App
    runtime_dependency: true
    trust_level: high
    security_risk: medium
    permissions_required: [github.read, github.create_pr, github.review]
    health_check: "gh auth status"
    update_policy: SaaS; monitor changelog for security-relevant changes.
    adapter_required: false
    cost_model: free tier + per-seat
    known_overlap: [gitlab, forgejo]
    knowledge_adoption: ADOPT
    runtime_decision: ADOPT
    notes: >
      Enforcement surface for git & release governance: main protected by ruleset;
      Release Gate = required status checks; prod deploy gated by an Environment
      whose required reviewer is the Human Founder. github.merge is non-grantable.

