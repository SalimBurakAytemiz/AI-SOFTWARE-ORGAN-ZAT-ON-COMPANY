# QA Portfolio web uygulaması CI.
# check job: typecheck + lint + birim testleri + production build.
# e2e job: Playwright kritik akış + erişilebilirlik (axe) testleri.
# Yalnızca web/ altındaki değişikliklerde çalışır.
name: qa-portfolio-web

on:
  pull_request:
    paths:
      - "projects/qa-portfolio/web/**"
      - ".github/workflows/qa-portfolio-web.yml"
  push:
    branches: [main]
    paths:
      - "projects/qa-portfolio/web/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/qa-portfolio/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/qa-portfolio/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/qa-portfolio/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Faz 2: kritik akış iskeleti + axe erişilebilirlik. Görsel regresyon
      # (visual-regression.spec.ts) taban görüntüler commit edilene kadar hariç.
      - run: npx playwright test public-site accessibility --project=chromium --project=mobile
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: failure()
        with:
          name: playwright-report
          path: projects/qa-portfolio/web/playwright-report/
          retention-days: 7
