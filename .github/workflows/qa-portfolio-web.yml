# QA Portfolio web uygulaması CI - typecheck + lint + birim testleri.
# Yalnızca web/ altındaki değişikliklerde çalışır. E2E ve Lighthouse faz 2.
name: qa-portfolio-web

on:
  pull_request:
    paths:
      - "projects/qa-portfolio/web/**"
      - ".github/workflows/qa-portfolio-web.yml"
  push:
    branches: [main]
    paths:
      - "projects/qa-portfolio/web/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/qa-portfolio/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/qa-portfolio/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
