# QA Portfolio web uygulaması CI.
#   check   : typecheck + lint + birim/bileşen testleri + production build
#   e2e     : Playwright kritik akış + erişilebilirlik (axe) + görsel regresyon
#   lighthouse: performans / erişilebilirlik / SEO bütçesi (planning/15 T-1507)
# Yalnızca web/ altındaki değişikliklerde çalışır.
name: qa-portfolio-web

on:
  pull_request:
    paths:
      - "projects/qa-portfolio/web/**"
      - ".github/workflows/qa-portfolio-web.yml"
  push:
    branches: [main]
    paths:
      - "projects/qa-portfolio/web/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/qa-portfolio/web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/qa-portfolio/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/qa-portfolio/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Kritik akış iskeleti + axe + görsel regresyon (taban görüntüler linux/
      # chromium için commit'li). Baseline farkı = bloke edici inceleme öğesi.
      - run: npx playwright test --project=chromium --project=mobile
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: failure()
        with:
          name: playwright-report
          path: projects/qa-portfolio/web/playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    # NOT (Codespaces/headless sınırı): Lighthouse 12.6 + Chrome 151 bu projede
    # ilk denemede tab çökmesi yaşadı; --disable-dev-shm-usage ile çalışır hale
    # geldi (lighthouserc.json chromeFlags). Yerel Codespaces ölçümünde perf 100
    # (x5 sayfa), a11y 98-100 alındı; ancak headless ortamda SEO ve CLS metrikleri
    # kararsız (gerçek tarayıcıda CLS = 0.000, doğrulandı). Bu yüzden job
    # continue-on-error: assertion'lar RAPORLANIR ama PR'ı bloke ETMEZ. GitHub
    # runner Chrome'unda kararlı olduğu doğrulanınca bloke ediciye çevrilecek.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: projects/qa-portfolio/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # ubuntu-latest'te google-chrome-stable önyüklü; lhci onu otomatik bulur.
      - run: npm run lhci
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
